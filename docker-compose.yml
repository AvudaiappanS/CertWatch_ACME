# CertWatch Lab deployment
#   docker compose up -d            -> web + scheduler
#   docker compose --profile pebble up -d   -> also starts the Pebble test CA
services:
  web:
    build: .
    env_file: .env
    environment:
      SCHEDULER_ENABLED: "false"        # the scheduler container owns the jobs
      ACME_PEBBLE_DIRECTORY: https://pebble:14000/dir
    volumes:
      - certwatch-data:/srv/certwatch/data
    ports:
      - "80:8000"                       # HTTP-01 challenges arrive on port 80
    depends_on:
      pebble:
        condition: service_started
        required: false
    mem_limit: 512m
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    command: ["python3", "-c", "from app import create_app; create_app(); import time; time.sleep(10**9)"]
    environment:
      SCHEDULER_ENABLED: "true"
      ACME_PEBBLE_DIRECTORY: https://pebble:14000/dir
    volumes:
      - certwatch-data:/srv/certwatch/data
    # The scheduler serves no HTTP port; health = its python process is alive.
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0 if b'python3' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 384m
    restart: unless-stopped

  pebble:
    # Local RFC 8555 test CA - issues certificates without real validation.
    # Test only; never expose it publicly.
    image: ghcr.io/letsencrypt/pebble:latest
    profiles: ["pebble"]
    command: -config /test/config/pebble-config.json -strict  # the image entrypoint already runs pebble
    environment:
      PEBBLE_VA_ALWAYS_VALID: "1"
      PEBBLE_VA_NOSLEEP: "1"
    ports:
      # localhost only - a test CA must never be exposed publicly.
      # web/scheduler reach Pebble over the internal Docker network
      # (ACME_PEBBLE_DIRECTORY=https://pebble:14000/dir), not these ports.
      - "127.0.0.1:14000:14000"
      - "127.0.0.1:15000:15000"
    mem_limit: 512m
    restart: unless-stopped

volumes:
  certwatch-data:
